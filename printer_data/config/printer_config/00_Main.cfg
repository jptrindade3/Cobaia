########################################
# Configuração básica da impressora - SKR 1.4
########################################
# Define a porta USB utilizada no Pi para acessar a placa de controle
# Via ssh, utilizar o comando </dev/serial/by-id/*> para ter acesso ao diretório

[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1768_226001016898DF957B619162C62000F5-if00

[mcu EBBCan]
canbus_uuid: 136f112d26f3

[exclude_object]

[include 01_Movimentacao.cfg] # Configura os motores de movimento do X, Y e Z
[include 02_Extrusora.cfg] # Importa configurações da extrusora
[include 03_Drivers.cfg]
[include 04_Cama_aquecida.cfg] # Configurações da cama aquecida
[include 05_Bed_mesh.cfg] # Algorítmo e configuração de criação da bed mesh para nivelamento
[include 06_Neopixel.cfg] # Controle dos LEDs da impressora
[include 07_Input_shaper.cfg] # Arquivo com a configuração do input shaper e do pressure advance
[include 08_Screen.cfg] # Importa configurações do LCD pra impressora


[include Probe/00_BLTouch.cfg] # Importa configurações do BLTouch e do homming com o equipamento
[include Macros/00_Main_macros.cfg]

# Topologia de movimentação da impressora
[printer]
kinematics: cartesian
max_velocity: 400
max_accel: 8000
max_z_velocity: 100
max_z_accel: 1000
square_corner_velocity: 5.0

########################################
# Ajuste Skew da impressora
########################################
[skew_correction]
[skew_correction my_skew_profile]
xy_skew: 0.001133883015712107
xz_skew: 0.0013938495900200612
yz_skew: 0.0


